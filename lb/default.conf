upstream backend {
    server web1:5000;
    server web2:5000;
}
server {
    listen 80;
    
    location / {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
}
    location /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
}
    location /stub_status {
        stub_status;
        allow 172.16.0.0/12;  
        deny all;             
    }

}

