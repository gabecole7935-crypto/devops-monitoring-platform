version: '3'

services:
  lb:
    image: nginx:latest
    container_name: lb
    ports:
      - "8080:80"
    volumes:
      - ./lb/default.conf:/etc/nginx/conf.d/default.conf
    restart: always
    depends_on:
      - web1
      - web2
  web1:
    build: ./web1
    container_name: web1
    environment:
      - HOSTNAME=web1
    depends_on:
      - redis
      - mysql
    restart: always
  web2:
    build: ./web2
    container_name: web2
    environment:
      - HOSTNAME=web2
    depends_on:
      - redis
      - mysql
    restart: always
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    restart: always
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - "9100:9100"
    restart: always
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    restart: always
  redis:
    image: redis:alpine
    container_name: redis
    restart: always
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: testdb
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always
volumes:
  mysql_data:
