<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>监控大盘 · 服务器监控平台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f5f7;color:#1d1d1f;}
.nav{background:rgba(255,255,255,.9);backdrop-filter:blur(20px);padding:16px 40px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e5e5ea;position:sticky;top:0;z-index:10;}
.nav h1{font-size:18px;font-weight:600}
.nav .user{display:flex;align-items:center;gap:20px;font-size:14px}
.nav .user a{color:#0071e3;text-decoration:none}
.nav .user a:hover{text-decoration:underline}
.wrap{max-width:1100px;margin:0 auto;padding:40px}
h2{font-size:22px;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:32px;}
.card{background:white;border-radius:18px;padding:24px;box-shadow:0 2px 12px rgba(0,0,0,.04);}
.card .label{font-size:12px;color:#6e6e73;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;}
.card .value{font-size:32px;font-weight:700;letter-spacing:-.02em;}
.card .value.blue{color:#0071e3}
.card .value.green{color:#34c759}
.card .value.orange{color:#ff9500}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:32px;}
.info-card{background:white;border-radius:18px;padding:28px;box-shadow:0 2px 12px rgba(0,0,0,.04);}
.info-card h3{font-size:14px;color:#6e6e73;margin-bottom:8px;font-weight:500}
.info-card .num{font-size:36px;font-weight:700}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.info-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="nav">
  <h1>服务器监控平台</h1>
  <div class="user"><span>{{ current_user.username }}</span><a href="/logout">退出</a></div>
</div>

<div class="wrap">
  <h2>📊 系统总览</h2>
  <div class="grid">
    <div class="card"><div class="label">CPU 使用率</div><div class="value blue">{{ cpu }}%</div></div>
    <div class="card"><div class="label">内存使用率</div><div class="value green">{{ mem }}%</div></div>
    <div class="card"><div class="label">磁盘使用率</div><div class="value orange">{{ disk }}%</div></div>
    <div class="card"><div class="label">系统负载</div><div class="value">{{ load }}</div></div>
  </div>

  <div class="info-grid">
    <div class="info-card"><h3>监控服务器</h3><div class="num">{{ server_count }}</div></div>
    <div class="info-card"><h3>活跃告警</h3><div class="num">{{ alert_count }}</div></div>
  </div>

  <h2 style="margin-top: 40px;">🌐 Nginx 负载均衡状态</h2>
  <div class="grid" style="margin-bottom: 40px;">
    <div class="card"><div class="label">活跃连接数</div><div class="value blue">{{ nginx_conn }}</div></div>
    <div class="card"><div class="label">每秒请求数 (QPS)</div><div class="value green">{{ nginx_qps }}</div></div>
  </div>

  <h2>🔥 Prometheus 引擎状态</h2>
  <div class="grid" style="margin-bottom: 40px;">
    <div class="card"><div class="label">内存占用 (MB)</div><div class="value orange">{{ prom_mem_mb }}</div></div>
    <div class="card"><div class="label">运行状态</div><div class="value green">Healthy</div></div>
  </div>
</div>
</body>
</html>
