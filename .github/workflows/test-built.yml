name: Build and Push

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check docker-compose syntax
        run: docker compose config
      - name: Check nginx config
        run: docker compose run --rm --no-deps lb nginx -t

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Build and push web1
        uses: docker/build-push-action@v5
        with:
          context: ./web1
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/project1-web1:latest
      - name: Build and push web2
        uses: docker/build-push-action@v5
        with:
          context: ./web2
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/project1-web2:latest
